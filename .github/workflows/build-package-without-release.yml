name: Build AIpexium IDE (Alpha Testing)
on:
  workflow_dispatch: # Manual trigger only
    inputs:
      patch:
        description: 'Patch number (e.g., 2 for x.x.2)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'npm'
      
      - name: Get latest release tag
        id: get_latest_tag
        shell: bash
        run: |
          echo "🔍 Searching for latest semantic version tag..."
          # Get all v*.*.* tags
          ALL_TAGS=$(git tag -l "v*.*.*")
          # Filter to ONLY semantic versions (MAJOR < 2000)
          LATEST_TAG=$(echo "$ALL_TAGS" | while read tag; do
            if [ -n "$tag" ]; then
              VERSION=${tag#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              # Only include tags where MAJOR < 2000 (semantic versions)
              if [ "$MAJOR" -eq "$MAJOR" ] 2>/dev/null && [ "$MAJOR" -lt 2000 ]; then
                echo "$tag"
              fi
            fi
          done | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          
          # If no semantic version found, start fresh
          if [ -z "$LATEST_TAG" ]; then
            echo "⚠️  No semantic version tags found"
            echo "✨ Starting fresh with v1.105.0"
            LATEST_TAG="v1.105.0"
          else
            echo "✅ Found latest semantic version: $LATEST_TAG"
          fi
          
          # Extract version numbers (remove 'v' prefix)
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo ""
          echo "📌 Latest release version: $LATEST_TAG"
      
      - name: Calculate alpha version
        id: calc_version
        shell: bash
        run: |
          MAJOR="${{ steps.get_latest_tag.outputs.major }}"
          MINOR="${{ steps.get_latest_tag.outputs.minor }}"
          PATCH="${{ github.event.inputs.patch }}"
          
          # Build alpha version string for Git tag
          ALPHA_VERSION="$MAJOR.$MINOR.$PATCH-alpha.$PATCH"
          # Build numeric version for Inno Setup (replace -alpha.X with .X)
          NUMERIC_VERSION="$MAJOR.$MINOR.$PATCH.$PATCH"
          ALPHA_TAG="v$ALPHA_VERSION"
          
          echo "alpha_version=$ALPHA_VERSION" >> $GITHUB_OUTPUT
          echo "numeric_version=$NUMERIC_VERSION" >> $GITHUB_OUTPUT
          echo "alpha_tag=$ALPHA_TAG" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ Alpha version (Git tag): $ALPHA_VERSION"
          echo "✅ Numeric version (Inno Setup): $NUMERIC_VERSION"
      
      - name: Check if version already exists
        id: check_version
        shell: bash
        run: |
          ALPHA_TAG="${{ steps.calc_version.outputs.alpha_tag }}"
          if git rev-parse "$ALPHA_TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $ALPHA_TAG already exists!"
            echo "version_exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Tag $ALPHA_TAG is available"
            echo "version_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update package.json and product.json version
        if: steps.check_version.outputs.version_exists == 'false'
        shell: bash
        run: |
          ALPHA_VERSION="${{ steps.calc_version.outputs.alpha_version }}"
          NUMERIC_VERSION="${{ steps.calc_version.outputs.numeric_version }}"
          
          echo "📝 Updating package.json to version $ALPHA_VERSION"
          echo "📝 Updating product.json to numeric version $NUMERIC_VERSION (for Inno Setup)"
          
          # Get current package.json version
          CURRENT_PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Current package.json version: $CURRENT_PKG_VERSION"
          
          # Update version in package.json with alpha version
          if [ "$CURRENT_PKG_VERSION" != "$ALPHA_VERSION" ]; then
            npm version $ALPHA_VERSION --no-git-tag-version --allow-same-version
            echo "✅ package.json version updated to: $ALPHA_VERSION"
          else
            echo "ℹ️  package.json already at version $ALPHA_VERSION, skipping npm version"
          fi
          
          # Update version in product.json with numeric version (for Inno Setup compatibility)
          node -e "
            const fs = require('fs');
            const product = JSON.parse(fs.readFileSync('product.json', 'utf8'));
            product.version = '$NUMERIC_VERSION';
            fs.writeFileSync('product.json', JSON.stringify(product, null, '\t') + '\n');
          "
          
          # Verify the changes
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PRODUCT_VERSION=$(node -p "require('./product.json').version")
          echo "✅ Final package.json version: $PACKAGE_VERSION"
          echo "✅ Final product.json version: $PRODUCT_VERSION"
          
          # Check if there are any changes to commit
          if git diff --quiet package.json package-lock.json product.json; then
            echo "ℹ️  No version changes detected, skipping commit"
          else
            # Commit and push the version changes
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json product.json
            git commit -m "chore: bump version to $ALPHA_VERSION [skip ci]"
            git push
            echo "✅ Version changes committed and pushed"
          fi
      
      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Clean workspace (force remove node_modules)
        run: |
          npm i -g rimraf --no-save
          npx rimraf node_modules
      
      - name: Install dependencies (npm ci)
        if: steps.check_version.outputs.version_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --prefer-offline --no-audit
      
      - name: Compile Extensions
        if: steps.check_version.outputs.version_exists == 'false'
        run: npm run gulp -- compile-extensions
      
      - name: Build Windows x64 min
        if: steps.check_version.outputs.version_exists == 'false'
        run: npm run gulp -- vscode-win32-x64-min
      
      - name: Build Inno Updater
        if: steps.check_version.outputs.version_exists == 'false'
        run: npm run gulp -- vscode-win32-x64-inno-updater
      
      - name: Build User Setup
        if: steps.check_version.outputs.version_exists == 'false'
        run: npm run gulp -- vscode-win32-x64-user-setup
      
      - name: Build System Setup
        if: steps.check_version.outputs.version_exists == 'false'
        run: npm run gulp -- vscode-win32-x64-system-setup
      
      - name: Rename and collect setup files
        if: steps.check_version.outputs.version_exists == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-output
          
          $alphaVersion = "${{ steps.calc_version.outputs.alpha_version }}"
          
          $userSetupPath = ".build/win32-x64/user-setup/SIIDSetup.exe"
          if (Test-Path $userSetupPath) {
            Copy-Item $userSetupPath -Destination "./release-output/Siid-v$alphaVersion-UserSetup.exe"
            Write-Host "✓ User Setup copied and renamed"
          } else {
            Write-Error "User Setup not found at $userSetupPath"
            exit 1
          }
          
          $systemSetupPath = ".build/win32-x64/system-setup/SIIDSetup.exe"
          if (Test-Path $systemSetupPath) {
            Copy-Item $systemSetupPath -Destination "./release-output/Siid-v$alphaVersion-SystemSetup.exe"
            Write-Host "✓ System Setup copied and renamed"
          } else {
            Write-Error "System Setup not found at $systemSetupPath"
            exit 1
          }
      
      - name: Generate checksums
        if: steps.check_version.outputs.version_exists == 'false'
        shell: pwsh
        run: |
          cd release-output
          Get-ChildItem -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.Name).Hash
            $hash | Out-File -FilePath "$($_.Name).sha256" -NoNewline
            Write-Host "✓ Checksum for $($_.Name): $hash"
          }
      
      - name: Get build timestamp
        id: timestamp
        shell: bash
        run: |
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "build_date_compact=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
      
      - name: Create Alpha Release
        if: steps.check_version.outputs.version_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          name: "Alpexium IDE v${{ steps.calc_version.outputs.alpha_version }} (Alpha)"
          tag_name: ${{ steps.calc_version.outputs.alpha_tag }}
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            ## ⚠️ Alpha Release - Testing Only
            
            **Build Date:** ${{ steps.timestamp.outputs.build_date }}
            **Version:** v${{ steps.calc_version.outputs.alpha_version }}
            **Base Version:** ${{ steps.get_latest_tag.outputs.latest_tag }}
            **Patch Number:** ${{ github.event.inputs.patch }}
            
            ---
            
            ### 📦 Downloads
            
            | Installer | Description |
            |-----------|-------------|
            | **Siid-v${{ steps.calc_version.outputs.alpha_version }}-UserSetup.exe** | User installation (current user only, no admin required) |
            | **Siid-v${{ steps.calc_version.outputs.alpha_version }}-SystemSetup.exe** | System installation (all users, requires administrator) |
            
            ### 🔐 Checksums
            Use the .sha256 files to verify your download integrity.
            
            ---
            
            ### ⚠️ Alpha Testing Notice
            This is a pre-release alpha version for testing purposes only. It may contain bugs and instabilities.
            
            **Based on:** Latest release ${{ steps.get_latest_tag.outputs.latest_tag }}
            **Alpha Patch:** ${{ github.event.inputs.patch }}
          files: |
            release-output/*.exe
            release-output/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Build Artifacts
        if: steps.check_version.outputs.version_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: alpexium-ide-alpha-v${{ steps.calc_version.outputs.alpha_version }}
          path: |
            release-output/*.exe
            release-output/*.sha256
          retention-days: 30
      
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## 📊 Alpha Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Latest Release | \`${{ steps.get_latest_tag.outputs.latest_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Alpha Version (Git) | \`${{ steps.calc_version.outputs.alpha_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Numeric Version (Build) | \`${{ steps.calc_version.outputs.numeric_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Patch Number | **${{ github.event.inputs.patch }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Exists | ${{ steps.check_version.outputs.version_exists }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date | ${{ steps.timestamp.outputs.build_date }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_version.outputs.version_exists }}" == "true" ]; then
            echo "### ⚠️ Warning" >> $GITHUB_STEP_SUMMARY
            echo "Version ${{ steps.calc_version.outputs.alpha_tag }} already exists. Build was skipped." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "Alpha build ${{ steps.calc_version.outputs.alpha_tag }} completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** While the Git tag uses alpha versioning (\`${{ steps.calc_version.outputs.alpha_version }}\`), the build uses numeric versioning (\`${{ steps.calc_version.outputs.numeric_version }}\`) for Inno Setup compatibility." >> $GITHUB_STEP_SUMMARY
          fi
